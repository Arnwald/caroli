[package]
name = "caroli-cli"
description = "The caroli command: tight-binding systems and simulations described in TOML files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "caroli"
path = "src/main.rs"
# The binary shares its name with the `caroli` library: document only the library.
doc = false

[dependencies]
caroli = { path = "../caroli" }
faer.workspace = true
rayon.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "1"
