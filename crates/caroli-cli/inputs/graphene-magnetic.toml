# Spinful graphene with antiferromagnetic magnetic impurities (A moments along +z, B along −z),
# as in Demion and Verga, PRB 90, 085412 (2014): densities of states on a torus, Born
# approximation, and the current and pairs under a strong electric field from the spin-up valence
# band (per unit area and one spin; the paper's are per cell and both spins: times √3).
#   caroli run crates/caroli-cli/inputs/graphene-magnetic.toml
title = "Graphene with magnetic impurities"

[parameters]
V = 0.2          # exchange J_I
n = 0.4          # impurity concentration per sublattice
F = 0.02         # force of the electric field

[model]
preset = "graphene"
spacing = "1/sqrt(3)"   # nearest neighbours: lattice constant 1
spin = true

[[disorder]]
type = "magnetic"
concentration = "n"
exchange = "V"
moments = "polarized"
sublattices = [0]
seed = 1

[[disorder]]
type = "magnetic"
concentration = "n"
exchange = "-V"
moments = "polarized"
sublattices = [1]
seed = 2

[system]
size = [96, 96]
periodic = true

[[run]]
type = "dos"
energies = { from = -3.3, to = 3.3, count = 331 }
moments = 1024
vectors = 4
projections = { up = "(s0 + sz)/2" }

[[run]]
type = "scba"
energies = { from = -1.0, to = 1.0, count = 41 }
k_grid = [96, 96]
eta = 0.01

[[run]]
type = "evolution"
force = [0.0, "F"]
dt = 0.1
steps = 500
every = 10
initial = { type = "band", orbitals = [0, 2], vectors = 2 }   # A↑, B↑
