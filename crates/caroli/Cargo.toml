[package]
name = "caroli"
description = "Toolbox for electronic transport in materials: tight-binding systems, geometry, disorder and Green's function solvers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# CUDA backend of caroli-gpu (f64, needs an NVIDIA driver at run time).
cuda = ["caroli-gpu/cuda"]

[dependencies]
caroli-lattice.workspace = true
caroli-model.workspace = true
caroli-green.workspace = true
caroli-disorder.workspace = true
caroli-keldysh.workspace = true
caroli-born.workspace = true
caroli-kpm.workspace = true
caroli-dynamics.workspace = true
caroli-torus.workspace = true
caroli-gpu.workspace = true
caroli-walk.workspace = true

[dev-dependencies]
serde_json = "1"
